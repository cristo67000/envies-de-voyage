<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planche de contrôle des symboles</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; background: #f4f1ec; color: #2b2622; margin: 0; padding: 24px; }
    h1 { font-size: 18px; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: #6b625a; margin: 28px 0 10px; }
    .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 14px; }
    .case { background: #fff; border-radius: 10px; padding: 12px 8px; text-align: center; box-shadow: 0 1px 3px #0002; }
    .case .rangee { display: flex; align-items: flex-end; justify-content: center; gap: 10px; min-height: 52px; }
    .case .p16 svg { width: 18px; height: 23px; }
    .case .p24 svg { width: 26px; height: 34px; }
    .case .nom { font-size: 11.5px; margin-top: 8px; color: #4a423b; }
    .case .cle { font-size: 10px; color: #9a938c; }
    .syms { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 6px; }
    /* ?loupe : contrôle du dessin lui-même, hors contexte d'usage. */
    body.loupe .grille { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    body.loupe .rangee { display: none; }
    body.loupe .syms svg:first-child { width: 96px; height: 96px; }
    body.loupe .syms svg:last-child { display: none; }
  </style>
</head>
<body>
  <h1>Planche de contrôle des symboles — 33 catégories</h1>
  <p>Épingle à taille réelle (36 px), épingle réduite (carte dézoomée), pictogramme seul 24 px et 16 px.</p>
  <div id="sortie"></div>
  <script src="../js/categories.js"></script>
  <script>
    (function () {
      if (location.search.indexOf('loupe') !== -1) document.body.classList.add('loupe');
      const out = document.getElementById('sortie');
      CAT.parFamille().forEach((f) => {
        const h = document.createElement('h2');
        h.textContent = f.nom;
        h.style.color = f.couleur;
        out.appendChild(h);
        const g = document.createElement('div');
        g.className = 'grille';
        f.categories.forEach((cle, i) => {
          const d = document.createElement('div');
          d.className = 'case';
          d.innerHTML =
            '<div class="rangee">' +
              '<span class="p24">' + CAT.svgEpingle(cle, { visite: i % 3 === 1, etoiles: i % 3 === 1 ? 3 : 0 }) + '</span>' +
              '<span class="p16">' + CAT.svgEpingle(cle) + '</span>' +
            '</div>' +
            '<div class="syms" style="color:' + f.couleur + '">' +
              CAT.svgSymbole(cle, 24) + CAT.svgSymbole(cle, 16) +
            '</div>' +
            '<div class="nom">' + CAT.nomDe(cle) + '</div>' +
            '<div class="cle">' + cle + '</div>';
          g.appendChild(d);
        });
        out.appendChild(g);
      });
    })();
  </script>
</body>
</html>
